[alembic]
script_location = alembic
prepend_sys_path = .
# `path_separator`, not `version_path_separator`: the latter was renamed in
# Alembic 1.20 and now raises a deprecation warning on every invocation, which
# `filterwarnings = ["error"]` promotes to a failure when the migration head is
# read from inside a test.
path_separator = os
# The database URL is injected from app settings in alembic/env.py.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
