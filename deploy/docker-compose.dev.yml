# Local development stack.
#
#   docker compose -f deploy/docker-compose.dev.yml up --build
#
# Services: postgres, redis, api, worker, beat, web (nginx serving the SPA and
# reverse-proxying /api and /ws to the api service).
#
# Monitoring (Prometheus / Grafana) is NOT part of this stack — the platform
# integrates with cluster-side instances (plan D6 / §9.2).

name: kube-wl-ai-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wl
      POSTGRES_PASSWORD: wl
      POSTGRES_DB: kube_wl_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wl -d kube_wl_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    environment: &backend-env
      APP_ENV: development
      SECRET_KEY: dev-only-not-for-production
      DATABASE_URL: postgresql+asyncpg://wl:wl@postgres:5432/kube_wl_ai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AUTH_PROVIDERS: local
      LOCAL_ADMIN_USERNAME: admin
      LOCAL_ADMIN_PASSWORD: admin
      LOG_LEVEL: INFO
      K8S_IN_CLUSTER: "false"
      # Mount a kubeconfig into the container and point at it for real
      # cluster operations; leave empty for a fully local run.
      KUBECONFIG: ""
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    build:
      context: ../backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ../backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info"]
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
