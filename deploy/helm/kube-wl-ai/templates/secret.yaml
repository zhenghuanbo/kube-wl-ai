{{- include "kube-wl-ai.validate" . -}}
{{/*
Credentials.

When `secrets.existingSecret` is set this file renders nothing at all, so an
operator who manages secrets out of band — External Secrets, SOPS, Vault — does
not get an empty Secret fighting theirs.
*/}}
{{- if not .Values.secrets.existingSecret }}
{{/*
Resolve the bundled database password exactly once.

Three cases, in order:

 1. the operator set one — use it;
 2. a Secret already exists from a previous install — reuse its value, because
    the PostgreSQL data directory recorded the old password at `initdb` time and
    a new one would lock the app out;
 3. neither — generate one.

`lookup` returns empty under `helm template`, so case 3 is what a dry run shows.
That is a rendering artefact, not a plan: the applied install reuses whatever is
already there.
*/}}
{{- $existingPg := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgresql" .Release.Name) -}}
{{- $pgPassword := "" -}}
{{- if .Values.postgresql.auth.password -}}
{{- $pgPassword = .Values.postgresql.auth.password -}}
{{- else if and $existingPg (index (default dict $existingPg.data) "postgres-password") -}}
{{- $pgPassword = index $existingPg.data "postgres-password" | b64dec -}}
{{- else -}}
{{- $pgPassword = randAlphaNum 32 -}}
{{- end -}}
{{- $dbUrl := include "kube-wl-ai.databaseUrl" (dict "root" . "password" $pgPassword) -}}
{{- $redisUrl := include "kube-wl-ai.redisUrl" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-wl-ai.secretName" . }}
  labels:
    {{- include "kube-wl-ai.labels" . | nindent 4 }}
  annotations:
    # Kept on upgrade: regenerating the signing key would invalidate every
    # session and every Grafana embed on each `helm upgrade`.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  secretKey: {{ required "secrets.secretKey is required when secrets.existingSecret is unset" .Values.secrets.secretKey | quote }}
  databaseUrl: {{ $dbUrl | quote }}
  redisUrl: {{ $redisUrl | quote }}
  {{- with .Values.secrets.localAdminPassword }}
  localAdminPassword: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.ldapBindPassword }}
  ldapBindPassword: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.harborRobotSecret }}
  harborRobotSecret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.jwtPrivateKey }}
  jwtPrivateKey: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.jwtPublicKey }}
  jwtPublicKey: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.grafanaJwtPrivateKey }}
  grafanaJwtPrivateKey: {{ . | quote }}
  {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    {{- include "kube-wl-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ $pgPassword | quote }}
  password: {{ $pgPassword | quote }}
{{- end }}
{{- end }}
