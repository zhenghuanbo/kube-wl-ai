# Serves the SPA and reverse-proxies the API so the browser only ever talks to
# one origin (no hardcoded host:port anywhere in the app — plan §10.4 / §11.2).
#
# Grafana is proxied through this same origin rather than embedded from its own
# hostname. Two reasons, and the second is the one that decides it:
#
#   1. The iframe needs no third-party cookie exemption, so an embedding
#      restriction on the Grafana side cannot silently blank the panel.
#   2. The app can then hand out *relative* Grafana URLs, which means the same
#      frontend build works whether Grafana lives on this host or another one.
#
# The upstream is a *variable*, resolved per request rather than at startup, and
# that is deliberate. An `upstream { server grafana:3000; }` block is resolved
# when nginx boots and a name that does not exist makes nginx **refuse to start**
# — so a deployment with no Grafana would lose the SPA and the API as well. With
# a variable, the only thing that breaks is /grafana/, which is exactly the
# module that is missing.
#
# `resolver` points at Docker's embedded DNS. On Kubernetes, replace it with the
# cluster DNS service (e.g. `kube-dns.kube-system.svc.cluster.local`) or set
# GRAFANA_PUBLIC_URL to Grafana's own hostname and delete this location.

upstream wl_api {
    server api:8000;
    keepalive 32;
}

# `$connection_upgrade` is "" for ordinary requests and "upgrade" for a websocket.
# Not cosmetic: hardcoding `Connection "upgrade"` on every request in a location
# breaks keepalive, and hardcoding "" breaks the websocket handshake. The IDE
# proxy needs both — it serves pages *and* kernel channels on the same prefix.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Long-lived hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://wl_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # WebSockets: interactive terminal and log streaming
    location /ws/ {
        proxy_pass http://wl_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The instance IDE proxy. Kept on this origin on purpose: the user-facing
    # address is `/x/{username}/{instance_id}/...`, so opening a notebook never
    # leaves the platform's hostname — which is the whole reason this is not an
    # Ingress. It carries whole applications, so its timeouts mirror `/ws/`.
    location /x/ {
        proxy_pass http://wl_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Notebook output can be large and arrives as a stream; buffering it would
        # delay every cell's output until the buffer filled.
        proxy_buffering off;
        # No gzip here. The upstream may already be compressing, and re-compressing
        # a stream that never ends is how a websocket gets stuck behind a buffer.
        gzip off;
    }

    location = /healthz {
        proxy_pass http://wl_api;
        access_log off;
    }

    # Grafana. `proxy_pass` without a trailing path preserves the /grafana/
    # prefix, which is where Grafana is configured to serve from
    # (`GF_SERVER_ROOT_URL` / `GF_SERVER_SERVE_FROM_SUB_PATH`).
    location /grafana/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $grafana_upstream "grafana:3000";
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Live dashboards hold a WebSocket and stream; the default 60s would
        # drop them every minute and look like a flickering panel.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # Grafana's own session cookie is never used here — authentication is
        # the JWT the backend mints — so there is no reason to carry it.
        proxy_set_header Cookie "";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, otherwise clients pin an old bundle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
