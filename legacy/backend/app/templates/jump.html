<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>跳转中...</title>
</head>
<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next');
    if (next) {
      window.location.href = next;
    }
  </script>
  <p>登录成功，正在跳转...</p>
</body>
</html>
